[package]
name = "foxhole"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "FoxHole — off-grid, keyboard-only, monochrome LXMF comms terminal"
readme = "README.md"
keywords = ["lxmf", "reticulum", "tui", "mesh", "off-grid"]
categories = ["command-line-utilities"]

[workspace]
members = ["crates/foxhole-micron", "crates/foxhole-cot", "crates/foxhole-map", "crates/foxhole-core", "crates/foxhole-tui", "crates/foxhole-net", "crates/foxhole-voice"]

# Shared metadata inherited by every member crate via `field.workspace = true`.
# The whole workspace ships under AGPL-3.0-or-later: the `net` build links the
# AGPL `rns-*`/`lxmf-core` stack, so a distributed combined work is AGPL anyway —
# see LICENSE and README §7. Edition 2024 needs Rust ≥ 1.85 and our own code uses
# `is_multiple_of` (stable 1.87), but the dependency tree (ratatui 0.30, time)
# raises the effective floor, so the declared MSRV is 1.88.
[workspace.package]
version = "0.1.2"
edition = "2024"
rust-version = "1.88"
license = "AGPL-3.0-or-later"
authors = ["Philippe Llerena <charlesbrenten@hotmail.com>"]
repository = "https://github.com/doubleailes/foxhole"

# Single source of truth for every shared dependency: versions and the pinned
# git tags live here, and member manifests inherit with `dep.workspace = true`
# (adding `features`/`optional` locally only where needed). Bumping a version or
# a Reticulum/LXMF tag is a one-file edit here (plus the matching `[patch]` tags
# below — `[patch]` entries cannot inherit, a Cargo limitation).
[workspace.dependencies]
# --- FoxHole's own layers (member crates) -------------------------------------
# Paths are relative to the workspace root, regardless of which member inherits.
foxhole-core   = { path = "crates/foxhole-core" }
foxhole-tui    = { path = "crates/foxhole-tui" }
foxhole-cot    = { path = "crates/foxhole-cot" }
foxhole-map    = { path = "crates/foxhole-map" }
foxhole-micron = { path = "crates/foxhole-micron" }
foxhole-net    = { path = "crates/foxhole-net" }
foxhole-voice  = { path = "crates/foxhole-voice" }

# --- Third-party --------------------------------------------------------------
# TUI framework (crossterm backend on by default).
ratatui = "0.30"
# Terminal control + async input. The `event-stream` feature (an `EventStream`
# of input events, multiplexed with network I/O via select!) is added by the
# binary; other consumers only need the key enums.
crossterm = "0.29"
# Async runtime: keeps network packet processing off the render path.
tokio = { version = "1", features = ["full"] }
# `StreamExt::next()` for crossterm's `EventStream` (tokio-family, lightweight) —
# avoids pulling the full `futures` crate for one combinator.
tokio-stream = "0.1"
# `bytes::Bytes` is the wire-buffer type the transport's `OutboundRequest` takes.
bytes = "1"
# Hex-encode 16-byte destination hashes for display and conversation keys.
hex = "0.4"
# Encode Nomad Network form submissions as the msgpack request map.
rmpv = "1.3"

# Cross-platform audio capture/playback for the `voice` feature (ALSA on Linux,
# CoreAudio on macOS, WASAPI on Windows). Consumed only by `foxhole-voice`, so
# the default and `net`-only builds never link an audio stack. On Debian/Ubuntu/
# Raspberry Pi OS the ALSA backend needs `libasound2-dev` at build time.
cpal = "0.16"
# Only `foxhole-voice` uses this, and only to silence ALSA's stderr chatter
# while a device is opened. Already in the tree via `cpal`/`crossterm`.
libc = "0.2"

# Sink for the mesh stack's own `tracing` diagnostics (delivery proofs, link
# lifecycle), which are otherwise discarded. `tracing-core` only: the whole
# subscriber is hand-rolled in `foxhole-net::trace`, so this adds no transitive
# deps beyond what the `rns-*` crates already pull in.
tracing-core = "0.1"
tracing = "0.1"

# --- Live-protocol git deps (consumed only by foxhole-net, behind `net`) ------
# LXMF messaging over Reticulum, and the Reticulum crates it builds on, pinned by
# immutable commit (an AGPL combined work). A git *tag* can be re-pointed to a
# different commit by the upstream repo owner, so a `cargo update` (or any build
# that ignores the committed Cargo.lock, e.g. `cargo install`) could silently pull
# unreviewed code; a commit hash cannot move. The `[patch]` block at the bottom
# redirects rsLXMF's sibling-path `rns-*` deps to this same rsReticulum commit.
#
# These revs are release v1.2.0 of each repo — the first rsReticulum release
# carrying the role-safe packet-proof fix (`f7ae0274c`), without which DIRECT
# delivery is never acknowledged (see docs/rsreticulum-delivery-proof-issue.md).
# Do not pin back below it; bump both repos' revs together when moving forward.
lxmf-core     = { git = "https://github.com/ratspeak/rsLXMF",      rev = "d58ea180118c0cb5f92692bfd96337193ef8bb91" }
# LXST — real-time voice/media over Reticulum (the `voice` feature). Same
# immutable-commit rule as above; this rev is rsLXST release v0.2.0, whose own
# `rns-*` deps are sibling-path references pinned to Reticulum 1.2.0 — the exact
# release the rest of the stack is on, so the `[patch]` block at the bottom
# unifies rsLXST onto the same rsReticulum source with no version skew.
lxst-core      = { git = "https://github.com/ratspeak/rsLXST", rev = "f228e2e1b1c026728c728549f70ce22633770009" }
lxst-telephony = { git = "https://github.com/ratspeak/rsLXST", rev = "f228e2e1b1c026728c728549f70ce22633770009" }
rns-crypto    = { git = "https://github.com/ratspeak/rsReticulum", rev = "dc6bc4ee82daf66b3b40386f9777dbe62b08fec2" }
rns-wire      = { git = "https://github.com/ratspeak/rsReticulum", rev = "dc6bc4ee82daf66b3b40386f9777dbe62b08fec2" }
rns-identity  = { git = "https://github.com/ratspeak/rsReticulum", rev = "dc6bc4ee82daf66b3b40386f9777dbe62b08fec2" }
rns-transport = { git = "https://github.com/ratspeak/rsReticulum", rev = "dc6bc4ee82daf66b3b40386f9777dbe62b08fec2" }
rns-runtime   = { git = "https://github.com/ratspeak/rsReticulum", rev = "dc6bc4ee82daf66b3b40386f9777dbe62b08fec2" }

[dependencies]
# --- FoxHole's own layers (workspace member crates) ---------------------------
# Domain model + state machine (logic only) and the terminal UI (rendering only).
# The binary wires them to the runtime and, under `net`, the live protocol stack.
foxhole-core = { workspace = true }
foxhole-tui = { workspace = true }
# CoT codec for the intel-sharing layer; `net.rs` parses inbound `cot/xml`
# payloads with it. Dependency-free, so it costs nothing in the offline build.
foxhole-cot = { workspace = true }

# Live networking layer (LXMF/Reticulum stack + encrypted stores). Optional so
# the default build stays dependency-light and offline; `--features net` pulls
# it (and, transitively, the heavy `rns-*`/`lxmf-core` git deps) in.
foxhole-net = { workspace = true, optional = true }

# TUI framework. The crossterm backend is enabled by default.
ratatui = { workspace = true }

# Terminal control + async input. `event-stream` gives us `EventStream`, a
# futures Stream of input events we can multiplex with network I/O via select!.
crossterm = { workspace = true, features = ["event-stream"] }

# Async runtime: keeps network packet processing off the render path.
tokio = { workspace = true }

# Provides `StreamExt::next()` for crossterm's `EventStream` (tokio-family,
# lightweight). Avoids pulling the full `futures` crate just for one combinator.
tokio-stream = { workspace = true }

# --- Protocol layer (live, behind the `net` feature) ---------------------------
# The LXMF/Reticulum stack and its encrypted stores now live in the
# `foxhole-net` member crate (optional dep above); it owns the heavy `rns-*` /
# `lxmf-core` git deps. The `[patch]` block at the bottom still belongs here
# because patches are only honoured in the workspace-root manifest.

[features]
default = ["splash"]
# Native cold-boot splash: a text-only bring-up sequence that doubles as a live
# readiness monitor (see crates/foxhole-tui/src/splash.rs). Pure ASCII, no extra
# dependencies — the feature only gates FoxHole's own code; `--no-default-features`
# drops it. Forwarded to the core (state) and tui (renderer) crates.
splash = ["foxhole-core/splash", "foxhole-tui/splash"]
# Live LXMF/Reticulum protocol stack. Flips the status bar to NET:ON and brings up
# the real transport + LXMF router in `src/net.rs` (see docs/lxmf-integration.md).
# Also enables the matching net-only cfg gating in the core/tui crates.
net = [
    "dep:foxhole-net",
    "foxhole-core/net",
    "foxhole-tui/net",
]
# Live LXST voice calls (see docs/lxst-voice.md). Implies `net`: telephony rides
# the same Reticulum transport the LXMF stack brings up, so `foxhole-net` owns
# the `foxhole-voice` task and hands it `transport_tx`. Off by default — it pulls
# the rsLXST stack, a bundled Opus encoder, and a platform audio backend (ALSA on
# Linux, so `libasound2-dev` must be installed to build it). The Voice tool
# itself is always present; without this feature it says the stack is offline.
voice = [
    "net",
    "foxhole-net/voice",
    "foxhole-tui/voice",
]

# `rsLXMF`'s crates depend on the `rns-*` libraries via sibling-checkout paths
# (`../rsReticulum/...`), which don't exist when `rsLXMF` is fetched from git.
# Redirect those to the same pinned `rsReticulum` commit so cargo can unify the
# whole stack on one Reticulum source. The patch key must be the *source being
# replaced* — the rsLXMF git URL, since that is where cargo looks for those
# path deps. (Only consulted under `--features net`.) Keep these revs in lockstep
# with the `[workspace.dependencies]` rsReticulum rev above.
[patch."https://github.com/ratspeak/rsLXMF"]
rns-crypto    = { git = "https://github.com/ratspeak/rsReticulum", rev = "dc6bc4ee82daf66b3b40386f9777dbe62b08fec2" }
rns-wire      = { git = "https://github.com/ratspeak/rsReticulum", rev = "dc6bc4ee82daf66b3b40386f9777dbe62b08fec2" }
rns-identity  = { git = "https://github.com/ratspeak/rsReticulum", rev = "dc6bc4ee82daf66b3b40386f9777dbe62b08fec2" }
rns-link      = { git = "https://github.com/ratspeak/rsReticulum", rev = "dc6bc4ee82daf66b3b40386f9777dbe62b08fec2" }
rns-protocol  = { git = "https://github.com/ratspeak/rsReticulum", rev = "dc6bc4ee82daf66b3b40386f9777dbe62b08fec2" }
rns-transport = { git = "https://github.com/ratspeak/rsReticulum", rev = "dc6bc4ee82daf66b3b40386f9777dbe62b08fec2" }
rns-runtime   = { git = "https://github.com/ratspeak/rsReticulum", rev = "dc6bc4ee82daf66b3b40386f9777dbe62b08fec2" }
rns-interface = { git = "https://github.com/ratspeak/rsReticulum", rev = "dc6bc4ee82daf66b3b40386f9777dbe62b08fec2" }

# rsLXST reaches for the `rns-*` libraries the same way rsLXMF does — sibling
# checkout paths (`../rsReticulum/crates/...`) that don't exist in a git fetch —
# so it needs its own patch table keyed by *its* URL. Same pinned rsReticulum
# commit as the block above: one Reticulum source for LXMF and LXST alike, which
# is what lets the voice task share the transport the LXMF stack brought up.
# (Only consulted under `--features voice`.)
[patch."https://github.com/ratspeak/rsLXST"]
rns-crypto    = { git = "https://github.com/ratspeak/rsReticulum", rev = "dc6bc4ee82daf66b3b40386f9777dbe62b08fec2" }
rns-identity  = { git = "https://github.com/ratspeak/rsReticulum", rev = "dc6bc4ee82daf66b3b40386f9777dbe62b08fec2" }
rns-interface = { git = "https://github.com/ratspeak/rsReticulum", rev = "dc6bc4ee82daf66b3b40386f9777dbe62b08fec2" }
rns-link      = { git = "https://github.com/ratspeak/rsReticulum", rev = "dc6bc4ee82daf66b3b40386f9777dbe62b08fec2" }
rns-runtime   = { git = "https://github.com/ratspeak/rsReticulum", rev = "dc6bc4ee82daf66b3b40386f9777dbe62b08fec2" }
rns-transport = { git = "https://github.com/ratspeak/rsReticulum", rev = "dc6bc4ee82daf66b3b40386f9777dbe62b08fec2" }
rns-wire      = { git = "https://github.com/ratspeak/rsReticulum", rev = "dc6bc4ee82daf66b3b40386f9777dbe62b08fec2" }
