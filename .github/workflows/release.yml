name: Release

# Cut the shipping binaries when a GitHub release is published and attach them to
# that release. Four assets, one per (platform × configuration) pair, each with a
# SHA-256 checksum file:
#
#   foxhole-<tag>-x86_64-unknown-linux-gnu.tar.gz       offline (default)
#   foxhole-<tag>-x86_64-unknown-linux-gnu-net.tar.gz   live mesh (--features net)
#   foxhole-<tag>-x86_64-pc-windows-msvc.zip            offline (default)
#   foxhole-<tag>-x86_64-pc-windows-msvc-net.zip        live mesh (--features net)
#
# The `-net` builds link the AGPL-3.0-or-later rsReticulum/rsLXMF stack, so they
# ship as a combined AGPL work (LICENSE travels in the archive; see README §7 for
# the network-use clause the operator inherits).
#
# `workflow_dispatch` re-cuts the assets for an existing release tag (e.g. after
# a runner failure) without having to delete and re-publish the release.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and upload to (e.g. v0.1.0)
        required: true
        type: string

# The release upload is the only write this workflow needs.
permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.platform.target }} (${{ matrix.variant.id }})
    runs-on: ${{ matrix.platform.os }}
    strategy:
      # One combination failing must not cancel the other three assets.
      fail-fast: false
      matrix:
        platform:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
        variant:
          # The dependency-light offline terminal, and the live mesh compartment
          # (which additionally fetches the pinned rsReticulum/rsLXMF git revs).
          - { id: offline, flags: "", suffix: "" }
          - { id: net, flags: "--features net", suffix: "-net" }
    # bash on both runners (Git for Windows ships it), so the packaging steps
    # below are written once instead of per-platform.
    defaults:
      run:
        shell: bash
    steps:
      - name: Resolve release tag
        id: meta
        run: |
          tag="${{ github.event.release.tag_name || inputs.tag }}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "name=foxhole-$tag-${{ matrix.platform.target }}${{ matrix.variant.suffix }}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          # Build the tagged tree, not the branch head the event points at.
          ref: ${{ steps.meta.outputs.tag }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.platform.target }}-${{ matrix.variant.id }}

      # `--locked` so the release is built from the committed Cargo.lock — which
      # pins the mesh stack's git revs as well.
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.platform.target }} ${{ matrix.variant.flags }}

      - name: Package
        id: package
        run: |
          set -euo pipefail
          name='${{ steps.meta.outputs.name }}'
          bin="target/${{ matrix.platform.target }}/release/foxhole"
          mkdir -p "dist/$name"
          if [ '${{ runner.os }}' = 'Windows' ]; then
            cp "$bin.exe" "dist/$name/"
          else
            cp "$bin" "dist/$name/"
            strip "dist/$name/foxhole"
          fi
          # Ship the licence with the binary (AGPL) plus the operator docs.
          cp README.md LICENSE CHANGELOG.md SECURITY.md "dist/$name/"
          # The mesh build's binding notes travel with the mesh build.
          if [ -n '${{ matrix.variant.suffix }}' ]; then
            cp docs/lxmf-integration.md "dist/$name/"
          fi
          cd dist
          if [ '${{ matrix.platform.archive }}' = 'zip' ]; then
            7z a -tzip "$name.zip" "$name" > /dev/null
          else
            tar czf "$name.tar.gz" "$name"
          fi
          asset="$name.${{ matrix.platform.archive }}"
          sha256sum "$asset" > "$asset.sha256"
          echo "asset=dist/$asset" >> "$GITHUB_OUTPUT"

      # Keeps the archives reachable from the run itself, which is handy when a
      # dispatch build is being checked before it lands on the release.
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.name }}
          path: ${{ steps.package.outputs.asset }}*
          if-no-files-found: error

      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release upload '${{ steps.meta.outputs.tag }}' \
            '${{ steps.package.outputs.asset }}' \
            '${{ steps.package.outputs.asset }}.sha256' \
            --clobber
