[package]
name = "foxhole-voice"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "FoxHole — live LXST voice calls over Reticulum (the `voice` feature)"

[dependencies]
# Domain model: the `VoiceCommand`/`VoiceEvent` vocabulary the UI speaks, plus
# `NetEvent` (voice reports back over the same channel the LXMF task uses).
# Dependency-light — this crate is the only place LXST/audio types appear.
foxhole-core = { workspace = true }

# --- LXST telephony (rsLXST) ---------------------------------------------------
# `lxst-telephony` is the whole application seam (call state, destination
# registration, discovery, link ownership, Opus stream boundaries); `lxst-core`
# supplies the profile table and the `RawAudioFrame` the audio backend fills.
lxst-core = { workspace = true }
lxst-telephony = { workspace = true }

# --- Reticulum ------------------------------------------------------------------
# The identity we register the `lxst.telephony` destination under, and the
# transport channel `foxhole-net` hands us once it has brought the stack up.
rns-identity = { workspace = true }
rns-transport = { workspace = true }

# --- Runtime + platform audio ---------------------------------------------------
tokio = { workspace = true }
# Microphone capture and speaker playback. rsLXST deliberately owns no device
# integration ("applications still own capture/playback and resampling into
# RawAudioFrame"), so that half lives in `audio.rs`.
cpal = { workspace = true }
hex = { workspace = true }
